<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TriageBridge — messy input, verified action</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1>TriageBridge</h1>
    <p class="tagline">Messy input in. Verified action out.</p>
  </div>
</header>

<main class="workbench">

  <!-- INTAKE -->
  <section class="pane intake" aria-labelledby="intake-heading">
    <h2 id="intake-heading">Intake</h2>

    <div class="field-group">
      <label for="symptoms">What's going on right now</label>
      <div class="input-row">
        <textarea id="symptoms" rows="3" placeholder="Describe symptoms, or press the mic and speak"></textarea>
        <button type="button" id="micBtn" class="icon-btn" title="Speak instead of typing">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v4M9 22h6"/></svg>
        </button>
      </div>
      <p class="hint" id="micStatus"></p>
    </div>

    <div class="field-group">
      <label for="history">Messy medical history — paste notes, old prescriptions, discharge summaries</label>
      <textarea id="history" rows="6" placeholder="Paste anything: half-remembered dosages, old letters, texts from a doctor..."></textarea>
    </div>

    <div class="field-group">
      <label for="photo">Photo — rash, injury, pill bottle, medication label</label>
      <input type="file" id="photo" accept="image/*" />
      <div id="photoPreviewWrap" class="photo-preview" hidden>
        <img id="photoPreview" alt="Uploaded photo preview" />
      </div>
    </div>

    <button type="button" id="runBtn" class="run-btn">Run TriageBridge</button>
    <p class="hint" id="runStatus"></p>
  </section>

  <!-- PIPELINE OUTPUT -->
  <section class="pane pipeline" aria-labelledby="pipeline-heading">
    <h2 id="pipeline-heading">Pipeline</h2>

    <article class="stage" id="stage1" data-state="pending">
      <div class="stage-head">
        <span class="stage-index">1</span>
        <h3>Extracted facts</h3>
        <span class="stage-flag" id="stage1flag">waiting</span>
      </div>
      <div class="stage-body" id="stage1body"></div>
    </article>

    <article class="stage" id="stage2" data-state="pending">
      <div class="stage-head">
        <span class="stage-index">2</span>
        <h3>Verification</h3>
        <span class="stage-flag" id="stage2flag">waiting</span>
      </div>
      <div class="stage-body" id="stage2body"></div>
    </article>

    <article class="stage stage-final" id="stage3" data-state="pending">
      <div class="stage-head">
        <span class="stage-index">3</span>
        <h3>Action plan</h3>
        <span class="stage-flag" id="stage3flag">waiting</span>
      </div>
      <div class="stage-body" id="stage3body"></div>
    </article>

  </section>
</main>

<footer class="disclaimer">
  Prototype built for PromptWars × Techverse. Not a substitute for professional medical judgment — in an emergency, call local emergency services first.
</footer>

<script src="script.js"></script>
</body>
</html>
